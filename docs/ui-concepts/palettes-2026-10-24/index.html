<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>컬러 팔레트 3안 · WESTBOUND</title>
<style>
@font-face{font-family:Preview;src:url('../../../assets/PretendardVariable-1.3.9.woff2') format('woff2');font-weight:100 900;font-display:swap}
*{box-sizing:border-box}body{margin:0;background:#f5f4f1;color:#292b2f;font-family:Preview,sans-serif}main{max-width:1376px;margin:auto;padding:40px 32px 26px}h1{margin:0;font-size:34px;letter-spacing:-.03em;font-weight:800}p{line-height:1.6}.intro{margin:10px 0 24px;color:#626567;font-size:15px}.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;padding-bottom:24px;border-bottom:1px solid #d7d7d2}.group{display:flex;flex-wrap:wrap;gap:6px}button,a{font:inherit}button{min-height:42px;padding:9px 16px;border:1px solid #d3d4d0;border-radius:8px;background:#fff;color:#484b4b;cursor:pointer;font-size:13px;font-weight:650}button[aria-pressed=true]{background:#303b3b;color:white;border-color:#303b3b}button:focus-visible,a:focus-visible{outline:3px solid #485e82;outline-offset:3px}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px;padding-top:25px}.option{min-width:0}.heading{display:flex;align-items:baseline;gap:10px}h2{margin:0;font-size:23px;letter-spacing:-.025em}.letter{font-size:14px;font-weight:800;color:#666b69}.description{min-height:43px;margin:8px 0 14px;color:#626567;font-size:13px;line-height:1.6}.swatches{display:flex;gap:6px;margin-bottom:16px}.swatch{flex:1;min-width:0}.paint{height:30px;border-radius:5px;border:1px solid #0000000c}.swatch code{display:block;margin-top:6px;font-family:Preview,sans-serif;font-size:10px;font-weight:650;color:#626567;text-align:center}.preview-shell{max-width:390px;margin:auto;border:1px solid #d7d7d2;border-radius:19px;overflow:hidden;background:white;box-shadow:0 12px 25px #3333330a}iframe{display:block;width:100%;height:1050px;border:0;background:#fff}footer{margin-top:25px;color:#626567;font-size:12px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}.full{display:block;margin:14px 0 0;text-align:center;color:#414e52;text-underline-offset:4px;font-size:12px}.desktop .preview-shell{max-width:none;border-radius:9px}.desktop iframe{width:1440px;height:1100px;transform:scale(var(--preview-scale));transform-origin:top left}.desktop .preview-shell{height:calc(1100px * var(--preview-scale))}::selection{background:#303b3b;color:white}@media(max-width:1000px){.options{grid-template-columns:1fr;gap:36px}.option{max-width:600px;width:100%;margin:auto}.description{min-height:0}.preview-shell{max-width:390px}main{padding:28px 20px}.swatches{max-width:390px;margin-left:auto;margin-right:auto}h1{font-size:29px}.desktop .preview-shell{max-width:none}.desktop iframe{height:1100px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main>
<h1>여행 앱, 세 가지 컬러 팔레트</h1><p class="intro">같은 화면에 색만 바꿔 적용했습니다. 헤더, 선택한 날짜, 일정 카드, 하단 메뉴를 비교해 보세요.</p>
<div class="toolbar"><div class="group" aria-label="화면 크기"><button data-device="mobile" aria-pressed="true">모바일</button><button data-device="desktop" aria-pressed="false">데스크톱</button></div><div class="group" aria-label="미리보기 화면"><button data-view="d1" aria-pressed="true">일정</button><button data-view="prep" aria-pressed="false">준비</button><button data-view="money" aria-pressed="false">가계부</button></div><div class="group" aria-label="밝기"><button data-theme-choice="light" aria-pressed="true">밝게</button><button data-theme-choice="dark" aria-pressed="false">어둡게</button></div></div>
<div class="options" id="options"></div>
<footer><span>현재 앱의 배치·글꼴 유지 · 로컬 설정 기반 · 가계부 금액은 예시</span><span>검토용 목업 · 2026. 10. 24 · 앱 적용 전</span></footer>
</main><script>
const palettes=[{id:'a',name:'네이비 · 코랄',description:'익숙한 네이비에 따뜻한 코랄. 또렷하고 활기 있는 여행 플래너.',colors:['#17324D','#B34738','#F6F3EF','#FFFEFC','#253344']},{id:'b',name:'포레스트 · 샌드',description:'짙은 숲색과 부드러운 모래색. 오래 보기 편안한 차분한 분위기.',colors:['#183E36','#2D6754','#DFC498','#F1F4EE','#243B32']},{id:'c',name:'플럼 · 로즈',description:'깊은 자두색에 말린 장미빛. 부드럽고 정돈된 여행 다이어리.',colors:['#49344E','#A33F65','#EAB4C7','#F8F2F5','#3C2F3C']}];
document.querySelector('#options').innerHTML=palettes.map(p=>`<article class="option"><div class="heading"><span class="letter">${p.id.toUpperCase()}</span><h2>${p.name}</h2></div><p class="description">${p.description}</p><div class="swatches" aria-label="${p.name} 색상">${p.colors.map(c=>`<div class="swatch"><div class="paint" style="background:${c}"></div><code>${c}</code></div>`).join('')}</div><div class="preview-shell"><iframe src="${p.id}.html" title="${p.name} 적용 목업" sandbox="allow-scripts allow-same-origin"></iframe></div><a class="full" href="${p.id}.html" target="_blank" rel="noopener">${p.id.toUpperCase()}안 크게 보기 ↗</a></article>`).join('');
let view='d1',theme='light';
function update(){document.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage({type:'palette-preview',view,theme},location.origin))}
function selected(el,selector){document.querySelectorAll(selector).forEach(b=>b.setAttribute('aria-pressed',String(b===el)))}
function scale(){document.querySelectorAll('.option').forEach(o=>o.style.setProperty('--preview-scale',o.querySelector('.preview-shell').clientWidth/1440))}
document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{document.body.classList.toggle('desktop',b.dataset.device==='desktop');selected(b,'[data-device]');scale()});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;selected(b,'[data-view]');update()});
document.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>{theme=b.dataset.themeChoice;selected(b,'[data-theme-choice]');update()});
addEventListener('resize',scale);document.querySelectorAll('iframe').forEach(f=>f.addEventListener('load',update));scale();
</script></body></html>
