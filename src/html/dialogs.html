<section class="auth-dialog" id="authDialog" hidden aria-modal="true" aria-labelledby="authTitle" role="dialog"><form class="auth-card" id="authForm"><h2 id="authTitle">편집자 확인</h2><label for="editorPassword">편집 비밀번호</label><input autocomplete="current-password" id="editorPassword" required type="password"><div class="auth-actions"><button class="auth-cancel" id="authCancel" type="button">취소</button><button class="auth-submit" id="authSubmit" type="submit">확인</button></div><div aria-live="polite" class="auth-error" id="authError"></div></form></section>
<section class="notice-dialog" id="noticeDialog" hidden aria-modal="true" aria-labelledby="noticeTitle" role="dialog"><div class="notice-card"><h2 id="noticeTitle"></h2><p id="noticeMessage"></p><p class="session-countdown" id="sessionCountdown" hidden></p><label class="dialog-field" id="noticeField" hidden><span id="noticeFieldLabel">버전 메모</span><input id="noticeInput" maxlength="120" placeholder="예: LA 일정 확정" type="text"></label><div class="notice-actions" id="noticeActions"></div></div></section>
<section class="version-dialog" id="versionDialog" hidden aria-modal="true" aria-labelledby="versionTitle" role="dialog"><div class="version-card"><div class="version-head"><div><h2 id="versionTitle">저장 버전 관리</h2></div><button class="action-muted" id="closeVersionsBtn" type="button">닫기</button></div><p id="versionLoadStatus" role="status" hidden></p><div class="version-list" id="versionList"></div></div></section>
<section class="notice-dialog" id="versionCompareDialog" hidden aria-modal="true" aria-labelledby="versionCompareTitle" role="dialog"><div class="notice-card import-card"><h2 id="versionCompareTitle">버전 차이 비교</h2><p id="versionCompareSummary"></p><div class="import-diff" id="versionCompareDiff"></div><div class="notice-actions"><button class="action-muted" id="versionCompareClose" type="button">닫기</button><button class="action-primary" id="versionCompareRestore" type="button">이 버전 복원</button></div></div></section>
<section class="notice-dialog" id="categoryDialog" hidden aria-modal="true" aria-labelledby="categoryTitle" role="dialog"><div class="notice-card category-card"><h2 id="categoryTitle">카테고리 편집</h2><label class="dialog-field"><span>카테고리 이름</span><input id="categoryName" maxlength="24" type="text" aria-describedby="categoryNameError"><small class="field-error" id="categoryNameError" role="alert" hidden></small></label><div class="icon-picker" id="categoryIconPicker" aria-label="카테고리 아이콘"></div><div class="notice-actions"><button class="action-muted" id="categoryCancel" type="button">취소</button><button class="action-primary" id="categorySave" type="button">적용</button></div></div></section>
<section class="notice-dialog" id="checklistDialog" hidden aria-modal="true" aria-labelledby="checklistDialogTitle" role="dialog"><div class="notice-card checklist-editor-card"><h2 id="checklistDialogTitle">목록 편집</h2><div id="checklistEditorRows"></div><button class="btn" id="checklistAdd" type="button" data-icon="plus">항목 추가</button><p id="checklistEditorError" role="status" aria-live="polite"></p><div class="notice-actions"><button class="action-muted" id="checklistCancel" type="button">취소</button><button class="action-primary" id="checklistSave" type="button">저장</button></div></div></section>
<section class="notice-dialog" id="ledgerSettingsDialog" hidden aria-modal="true" aria-labelledby="ledgerSettingsTitle" role="dialog"><div class="notice-card"><h2 id="ledgerSettingsTitle">가계부 설정</h2><label class="ledger-settings-rate"><span>수동 환율 · 새 자동 계산에 적용</span><span class="ledger-settings-rate-control">1 USD = <input id="settingsExchangeRate" inputmode="decimal" type="text"> KRW</span></label><div class="ledger-settings-heading"><strong>카테고리</strong><button class="btn" data-icon="plus" id="settingsAddCategory" type="button">카테고리 추가</button></div><div class="ledger-settings-list" id="settingsCategoryList"></div><div class="notice-actions"><button class="action-primary" id="ledgerSettingsClose" type="button">설정 닫기</button></div></div></section>
<section class="notice-dialog" id="expenseDialog" hidden aria-modal="true" aria-labelledby="expenseDialogTitle" role="dialog"><div class="notice-card expense-edit-card"><h2 id="expenseDialogTitle">가계부 항목 수정</h2><div class="expense-edit-grid"><label class="dialog-field"><span>날짜</span><input id="expenseEditDate" type="date"></label><label class="dialog-field"><span>카테고리</span><select id="expenseEditCategory"></select></label><label class="dialog-field wide"><span>항목</span><input id="expenseEditName" maxlength="80" type="text" aria-describedby="expenseEditNameError"><small class="field-error" id="expenseEditNameError" role="alert" hidden></small></label><label class="dialog-field" for="expenseEditKrw"><span>원화 (KRW)</span><input id="expenseEditKrw" inputmode="decimal" placeholder="0" type="text" aria-describedby="expenseEditKrwHint"><small class="amount-hint" id="expenseEditKrwHint"></small></label><label class="dialog-field" for="expenseEditUsd"><span>달러 (USD)</span><input id="expenseEditUsd" inputmode="decimal" placeholder="0" type="text" aria-describedby="expenseEditUsdHint"><small class="amount-hint" id="expenseEditUsdHint"></small></label></div><div class="notice-actions"><button class="action-muted" id="expenseEditCancel" type="button">취소</button><button class="action-primary" id="expenseEditSave" type="button">수정 적용</button></div></div></section>
<section class="notice-dialog" id="scheduleTimeDialog" hidden aria-modal="true" aria-labelledby="scheduleTimeTitle" role="dialog">
  <div class="notice-card schedule-time-card">
    <h2 id="scheduleTimeTitle">일정 시간 설정</h2><p id="scheduleTimeContext"></p>
    <label class="dialog-field"><span>시간 입력 방식</span><select id="scheduleTimeMode"><option value="exact">시작·종료 시간</option><option value="label">오전·오후·미정 등</option></select></label>
    <div id="scheduleTimeExact">
      <div class="schedule-time-grid">
        <label class="dialog-field"><span>시작 시간</span><span class="schedule-clock"><input id="scheduleTimeStart" type="text" inputmode="numeric" placeholder="09:00" autocomplete="off" spellcheck="false" aria-describedby="scheduleTimeError"><span class="schedule-clock-display" aria-hidden="true"></span></span></label>
        <label class="dialog-field"><span>종료 시간 (선택)</span><span class="schedule-clock"><input id="scheduleTimeEnd" type="text" inputmode="numeric" placeholder="11:30" autocomplete="off" spellcheck="false" aria-describedby="scheduleTimeError"><span class="schedule-clock-display" aria-hidden="true"></span></span></label>
      </div>
    </div>
    <label class="dialog-field" id="scheduleTimeLabelField" hidden><span>시간대 또는 상태</span><input id="scheduleTimeLabel" type="text" maxlength="80" placeholder="예: 오전, 오후, 종일, 미정"></label>
    <label class="dialog-field"><span>시간대 표기 (선택)</span><input id="scheduleTimeZone" type="text" maxlength="80" placeholder="예: KST" aria-describedby="scheduleTimeZoneHelp"></label>
    <p class="schedule-time-help" id="scheduleTimeZoneHelp">기본: 여행지 현지 시간</p>
    <p class="schedule-time-preview" id="scheduleTimePreview" aria-live="polite"></p><p class="schedule-time-error" id="scheduleTimeError" role="alert" hidden></p>
    <div class="notice-actions"><button class="action-muted" id="scheduleTimeCancel" type="button">취소</button><button class="action-primary" id="scheduleTimeSave" type="button">적용</button></div>
  </div>
</section>
<section class="notice-dialog" id="mapDialog" hidden aria-modal="true" aria-labelledby="mapTitle" role="dialog"><div class="notice-card"><h2 id="mapTitle">지도 링크 첨부</h2><label class="dialog-field"><span>장소명</span><input id="mapName" maxlength="80" placeholder="예: 그리피스 천문대" type="text" aria-describedby="mapNameError"><small class="field-error" id="mapNameError" role="alert" hidden></small></label><label class="dialog-field"><span>Google Maps URL</span><input id="mapUrl" inputmode="url" placeholder="https://maps.google.com/..." type="url" aria-describedby="mapUrlError"><small class="field-error" id="mapUrlError" role="alert" hidden></small></label><div class="notice-actions"><button class="action-muted" id="mapCancel" type="button">취소</button><button class="action-primary" id="mapSave" type="button">첨부</button></div></div></section>
<section class="notice-dialog" id="photoEditDialog" hidden aria-modal="true" aria-labelledby="photoEditTitle" role="dialog"><div class="notice-card"><h2 id="photoEditTitle">사진 정보 편집</h2><label class="dialog-field"><span>사진 설명</span><input id="photoCaption" maxlength="100" placeholder="예: 숙소 외관" type="text"></label><label class="dialog-field"><span>대체 텍스트</span><input id="photoAlt" maxlength="160" placeholder="사진을 보지 못할 때 전달할 설명" type="text"></label><div class="notice-actions"><button class="action-muted" id="photoEditCancel" type="button">취소</button><button class="action-primary" id="photoEditSave" type="button">적용</button></div></div></section>

<section class="notice-dialog" id="exportDialog" hidden aria-modal="true" aria-labelledby="exportTitle" role="dialog"><div class="notice-card export-card"><h2 id="exportTitle">어떤 용도로 내보낼까요?</h2><div class="export-options"><button class="export-option" data-icon="work" id="offlineExportBtn" type="button"><span><strong>오프라인 작업본</strong><small>오프라인 편집·다시 불러오기 가능</small></span></button><button class="export-option" data-icon="readonly" id="exportBtn" type="button"><span><strong>인쇄·공유용 사본</strong><small>읽기 전용·사진 포함</small></span></button></div><div class="notice-actions"><button class="action-muted" id="exportCancel" type="button">취소</button></div></div></section>
