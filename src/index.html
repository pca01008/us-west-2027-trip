<!doctype html>
<html lang="ko" data-offline="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#142b3d">
<meta name="color-scheme" content="only light">
<script id="tripThemeBootstrap">
// @include theme.js
</script>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="서부여행 2027">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script id="pwaRegistration" src="./pwa.js" defer></script>
<title>여행 일정</title>
<link id="tripFontPreload" rel="preload" href="./assets/PretendardVariable-1.3.9.woff2" as="font" type="font/woff2" crossorigin>
<style id="trip-app-styles">
/* @include styles.css */
</style>
</head>
<body class="viewing hydrating">
<header><div class="hero-shell"><div class="theme-toolbar"><div class="theme-choice"><button id="themeToggle" type="button" aria-expanded="false" aria-controls="themeMenu" aria-describedby="themeStorageStatus"><span class="button-icon" aria-hidden="true"><svg viewBox="0 0 24 24"></svg></span>테마</button><div id="themeMenu" hidden><fieldset><legend>화면 테마</legend><label><input type="radio" name="themePreference" value="light"><span>밝게</span></label><label><input type="radio" name="themePreference" value="dark"><span>어둡게</span></label><label><input type="radio" name="themePreference" value="system"><span>기기 설정</span></label></fieldset></div></div><p id="themeStorageStatus" role="status" hidden></p></div><div class="hero-top"><div class="hero-copy"><span class="hero-kicker">TRIP PLANNER</span><h1 class="title">여행 일정</h1></div><div class="hero-meta"><div class="hero-meta-card hero-meta-dates"><small>TRAVEL DATES</small><strong>여행 기간</strong></div><div class="hero-meta-card"><small>ROUTE</small><strong>여행 경로</strong></div></div></div><div class="world-clocks" aria-label="두 지역 현재 시각"><div class="world-clock"><div class="world-clock-copy"><small>HOME</small><span id="homeDate">날짜 계산 중</span></div><time id="homeClock">--:--</time></div><div class="world-clock"><div class="world-clock-copy"><small>DESTINATION</small><span id="destinationDate">날짜 계산 중</span></div><time id="destinationClock">--:--</time></div><div class="time-gap" id="timeGap">시차 계산 중</div></div><div class="trip-progress" id="tripProgress"><div class="trip-progress-head"><strong id="tripProgressLabel">여행 준비 중</strong><span id="tripProgressMeta">일정을 계산하고 있습니다.</span></div><div class="trip-progress-track" aria-label="여행 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" role="progressbar"><i id="tripProgressFill"></i></div></div></div></header>
<script id="tripThemeControls">document.dispatchEvent(new Event('trip-theme-controls-ready'));</script>
<nav class="tabs" aria-label="여행 날짜"></nav>
<nav class="bottom-nav" aria-label="주 메뉴"><div>
<button type="button" id="nav-schedule" data-section="schedule" data-icon="calendar" aria-controls="tripMain timetableView">일정</button>
<button type="button" id="tab-prep" data-section="prep" data-icon="check" aria-controls="panel-prep">준비</button>
<button type="button" id="tab-money" data-section="money" data-icon="wallet" aria-controls="panel-money">가계부</button>
</div></nav>
<div class="editor-bar"><button class="primary" data-icon="edit" id="editBtn">편집 시작</button><button class="mode-only edit-only" data-icon="undo" id="undoBtn" disabled>실행 취소</button><button class="mode-only edit-only" data-icon="redo" id="redoBtn" disabled>다시 실행</button><button class="mode-only edit-only" data-icon="plus" id="addTimeBtn">일정 시간 추가</button><button class="mode-only edit-only" data-icon="check" id="addCheckBtn">체크 항목 추가</button><button class="mode-only edit-only danger" data-icon="reset" id="resetBtn">초기화</button><button class="mode-only view-only" data-icon="save" id="saveBtn" disabled>변경사항 저장</button><button class="mode-only view-only online-only" data-icon="upload" id="importBtn" title="오프라인 작업본을 최신 저장본과 비교해 초안으로 불러옵니다.">편집본 불러오기</button><button class="mode-only view-only" data-icon="export" id="exportMenuBtn">내보내기</button><button class="mode-only view-only online-only" data-icon="history" id="versionsBtn">버전 관리</button><button class="session-only" data-icon="logout" id="logoutBtn" type="button">로그아웃</button><button class="operation-only danger" data-icon="reset" id="cancelOperationBtn" type="button">작업 취소</button><span id="status" class="chip" role="status" aria-live="polite">보기 모드</span><input accept="text/html,.html" id="importFileInput" type="file" hidden></div>
<div class="preview-banner" id="previewBanner"><span id="previewLabel">저장 버전 미리보기</span><button id="closePreviewBtn" type="button">미리보기 종료</button></div>
<section class="app-loading" id="appLoading" role="status" aria-live="polite"><div class="app-loading-card"><span class="app-loading-spinner" aria-hidden="true"></span><div class="app-loading-copy"><strong>최신 여행 일정을 불러오는 중</strong></div></div></section>

<main id="tripMain" aria-busy="true"></main>
<script id="tripConfigScript" src="trip-config.js"></script>

<script id="offlineEmbeddedState" type="application/json">null</script>
<script id="tripAppV4">
// @include app.js
</script>
</body>
</html>
