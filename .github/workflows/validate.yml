name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      repeat_boundaries:
        description: Additional input/draft stability passes on a work branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:ci -- --suite=validate
        env:
          TRIP_CHECK_OUTPUT: ${{ runner.temp }}/westbound-ci-validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-summary
          path: ${{ runner.temp }}/westbound-ci-validate/
          if-no-files-found: warn
          retention-days: 7

  sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: trip-sql-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:ci -- --suite=sql
        env:
          TRIP_SQL_TEST_URL: postgresql://postgres:trip-sql-local-only@127.0.0.1:5432/postgres
          TRIP_CHECK_OUTPUT: ${{ runner.temp }}/westbound-ci-sql
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-summary
          path: ${{ runner.temp }}/westbound-ci-sql/
          if-no-files-found: warn
          retention-days: 7

  browser:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Trust the checked-out container workspace
        run: HOME=/root git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:ci -- --suite=browser
        env:
          HOME: /root
          TMPDIR: /tmp
          TRIP_CHECK_OUTPUT: /tmp/westbound-ci-browser
      - if: inputs.repeat_boundaries && github.ref != 'refs/heads/main'
        run: npm run test:browser:repeat
        env:
          HOME: /root
          TMPDIR: /tmp
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: /tmp/westbound-*/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-summary
          path: |
            /tmp/westbound-ci-browser/
            /tmp/westbound-browser-timing-*/
          if-no-files-found: warn
          retention-days: 7

  required:
    if: always()
    needs: [validate, sql, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Require every validation job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/require-validation.mjs

  pages-build:
    needs: required
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          build_revision: ${{ github.sha }}
      - run: node scripts/check-pages-artifact.mjs _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [required, pages-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject a superseded release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)" = "$EXPECTED_SHA"
      - id: deployment
        uses: actions/deploy-pages@v4
